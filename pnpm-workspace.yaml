packages:
  - dev/*
  - packages/*
  - packages/@sanity/*
  - plugins/*
  - plugins/@sanity/*
  - scripts/*
  - turbo/generators

allowBuilds:
  esbuild: false

catalog:
  '@hello-pangea/dnd': ^18.0.1
  '@hookform/resolvers': ^4.1.3
  '@portabletext/block-tools': ^5.1.11
  '@portabletext/to-html': ^5.0.2
  '@portabletext/types': ^4.0.2
  '@sanity/asset-utils': ^2.3.0
  '@sanity/client': ^7.23.2
  '@sanity/color': ^3.0.6
  '@sanity/icons': ^5.1.0
  '@sanity/image-url': ^2.1.1
  '@sanity/mutator': ^6.5.0
  '@sanity/pkg-utils': ^11.0.3
  '@sanity/preview-url-secret': ^4.0.8
  '@sanity/schema': ^6.5.0
  '@sanity/telemetry': '^1.1.0'
  '@sanity/tsconfig': ^2.2.1
  '@sanity/tsdown-config': ^0.17.2
  '@sanity/ui': ^3.3.5
  '@sanity/util': ^6.5.0
  '@sanity/uuid': ^3.0.3
  '@sanity/vanilla-extract-vite-plugin': ^0.1.1
  '@sanity/vision': ^6.5.0
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/react': ^16.3.2
  '@types/lodash-es': ^4.17.12
  '@types/node': ^24.13.3
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@types/react-is': ^19.2.0
  '@types/video.js': ^7.3.58
  '@typescript/native-preview': beta
  '@vanilla-extract/css': ^1.21.1
  '@vis.gl/react-google-maps': ^1.9.0
  babel-plugin-react-compiler: ^1.0.0
  date-fns: ^4.4.0
  jsdom: ^29.1.1
  lexorank: ^1.0.5
  lodash-es: ^4.18.1
  motion: ^12.42.2
  nanoid: ^6.0.0
  oxfmt: ^0.58.0
  oxlint: ^1.74.0
  oxlint-tsgolint: ^0.24.0
  react: ^19.2.7
  react-dom: ^19.2.7
  react-fast-compare: ^3.2.2
  react-hook-form: ^7.81.0
  react-icons: ^5.7.0
  react-is: ^19.2.7
  react-photo-album: ^3.6.0
  react-rx: ^4.2.3
  rxjs: ^7.8.2
  sanity: ^6.5.0
  styled-components: ^6.4.3
  suspend-react: ^0.1.3
  tsdown: ^0.22.8
  typescript: 7.0.2
  validate-npm-package-name: ^8.0.0
  video.js: ^7.21.7
  vitest: ^4.1.10

catalogs:
  # Ranges used in `peerDependencies` (referenced as `catalog:peer`).
  # Only the shared studio peers live here; niche one-off peers (e.g. `easymde`)
  # keep explicit ranges, and peers on other workspace packages keep `workspace:^`
  # (or an explicit range) so changesets can track dependents.
  peer:
    react: ^19.2
    react-dom: ^19.2
    sanity: ^5 || ^6.0.0-0
    styled-components: ^6.1

catalogMode: prefer
dedupeDirectDeps: true

dedupePeers: true
linkWorkspacePackages: deep

# Matches the pnpm v11 default (1 day)
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@changesets/cli'
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@portabletext/*'
  - '@rollup/*'
  - '@sanity/*'
  - '@types/*'
  - '@typescript/*'
  - '@vite/*'
  - '@vitejs/plugin-react'
  - '@vitest/*'
  - '@vercel/stega'
  - csstype
  - get-it
  - groq
  - groq-js
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - react
  - react-dom
  - react-is
  - rollup
  - sanity
  - vite
  - vitest
  # Renovate security update: lodash-es@4.17.23
  - lodash-es@4.17.23
  # Renovate security update: uuid@14.0.0
  - uuid@14.0.0
  # Renovate security update: turbo@2.9.14
  - turbo@2.9.14
  # tsdown can select a newly released rolldown-plugin-dts version.
  - tsdown
  - rolldown-plugin-dts

overrides:
  '@types/node': 'catalog:'
  sanity: 'catalog:'
  styled-components: npm:@sanity/styled-components@latest

patchedDependencies:
  '@bynder/compact-view': patches/@bynder__compact-view.patch

publicHoistPattern:
  # Allows setting vite/client in dev/test-studio/tsconfig.json without installing vite
  - 'vite'

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@octokit/endpoint@9.0.6'
  - '@octokit/plugin-paginate-rest@9.2.2'
  - '@sanity/sdk@2.1.2'
  - chokidar@4.0.3
  - groq@3.88.1-typegen-experimental.0
  - react-redux@8.1.3 || 9.2.0
  - reselect@5.1.1
  - rxjs@7.8.2
  - semver@5.7.2 || 6.3.1
  - ts-api-utils@2.3.0
  - undici@5.29.0
  - vite@6.4.1
