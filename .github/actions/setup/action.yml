name: 'Setup Environment'
description: 'Sets up pnpm and a Node.js runtime, and installs dependencies'

inputs:
  runtime:
    description: 'Runtime to install, e.g. node@lts or node@latest'
    required: false
    default: node@lts

runs:
  using: composite
  steps:
    - uses: pnpm/setup@v3
      with:
        runtime: ${{ inputs.runtime }}
        # The store cache would upload a new ~645 MiB entry after every job (its keys
        # include the run id) and evict the Playwright browser caches. The lockfile
        # verification cache is restored and saved regardless of this setting.
        cache: false
