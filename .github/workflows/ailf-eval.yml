name: AI Literacy Eval

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**/.ailf/**'
      - '.github/scripts/post-ailf-comment.cjs'
      - '.github/workflows/ailf-eval.yml'

  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Run in debug mode (fewer tests, faster iteration)'
        type: boolean
        default: false

  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: ailf-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover plugins with AILF coverage
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
      has_ailf: ${{ steps.list.outputs.has_ailf }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: list
        run: |
          plugins=$(find plugins -type d -name '.ailf' -not -path '*/node_modules/*' \
            | sed 's|/.ailf$||' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          if [ "$plugins" != "[]" ]; then
            echo "has_ailf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ailf=false" >> "$GITHUB_OUTPUT"
          fi

  evaluate:
    name: AI Literacy Evaluation
    needs: discover
    if: needs.discover.outputs.has_ailf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: lts/*

      - name: Compute plugin key
        id: key
        run: echo "key=$(basename '${{ matrix.plugin }}')" >> "$GITHUB_OUTPUT"

      - name: Run evaluation
        id: eval
        working-directory: ${{ matrix.plugin }}
        env:
          AILF_API_KEY: ${{ secrets.AILF_API_KEY }}
          AILF_CLASSIFICATION: adhoc
          AILF_OWNER_TEAM: 'studio'
          AILF_OWNER_INDIVIDUAL: ${{ github.actor }}
        run: |
          pnpm exec ailf run --remote \
            --output /tmp/ailf-report-${{ steps.key.outputs.key }}.md \
            ${{ inputs.debug_mode && '--debug' || '' }}

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          PLUGIN_KEY: ${{ steps.key.outputs.key }}
          PLUGIN_PATH: ${{ matrix.plugin }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const {postAilfPrComment} = require('./.github/scripts/post-ailf-comment.cjs')
            await postAilfPrComment({github, context})

      - name: Summary
        if: always()
        env:
          PLUGIN_KEY: ${{ steps.key.outputs.key }}
          PLUGIN_PATH: ${{ matrix.plugin }}
        run: |
          echo "## AI Literacy Evaluation - \`$PLUGIN_PATH\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "/tmp/ailf-report-$PLUGIN_KEY.md" ]; then
            cat "/tmp/ailf-report-$PLUGIN_KEY.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated. Check the workflow logs." >> "$GITHUB_STEP_SUMMARY"
          fi
