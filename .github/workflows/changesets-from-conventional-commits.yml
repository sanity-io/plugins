name: Add changeset to Renovate updates

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] delegates to reusable workflow; no PR code checkout here
    types: [opened, synchronize]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read # for checkout

jobs:
  call:
    uses: sanity-io/.github/.github/workflows/changesets-from-conventional-commits.yml@main
    if: github.event.pull_request.user.login == 'renovate[bot]' || github.event.pull_request.user.login == 'squiggler-app[bot]'
    secrets: inherit
