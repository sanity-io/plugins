name: E2E

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      CI: 'true'
      SANITY_E2E_PROJECT_ID: ${{ vars.SANITY_E2E_PROJECT_ID }}
      SANITY_E2E_STUDIO_DATASET: ${{ vars.SANITY_E2E_STUDIO_DATASET }}
      SANITY_E2E_BASE_URL: http://localhost:3333
      # test-studio reads SANITY_STUDIO_* at build/preview time
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_E2E_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ vars.SANITY_E2E_STUDIO_DATASET }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Add PR Comment placeholder for E2E status
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        if: github.event_name == 'pull_request'
        with:
          comment-tag: e2e-status
          message: |
            ### 🧪 E2E Tests

            ⏳ Setting up and running smoke tests… • [view progress](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Validate e2e secrets and vars
        env:
          SANITY_E2E_SESSION_TOKEN: ${{ secrets.SANITY_E2E_SESSION_TOKEN }}
        run: |
          missing=0
          if [ -z "$SANITY_E2E_SESSION_TOKEN" ]; then
            echo "::error::SANITY_E2E_SESSION_TOKEN secret is not set. Add a studio session/API token (not SANITY_DEPLOY_TOKEN). See e2e/README.md"
            missing=1
          fi
          if [ -z "$SANITY_E2E_PROJECT_ID" ]; then
            echo "::error::SANITY_E2E_PROJECT_ID repository variable is not set. See e2e/README.md"
            missing=1
          fi
          if [ -z "$SANITY_E2E_STUDIO_DATASET" ]; then
            echo "::error::SANITY_E2E_STUDIO_DATASET repository variable is not set. See e2e/README.md"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Store Playwright's Version
        id: playwright-version
        working-directory: e2e
        run: |
          PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Playwright's Version: $PLAYWRIGHT_VERSION"
          echo "version=${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: cache-playwright-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-version.outputs.version }}-playwright-browsers-chromium-firefox

      - name: Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Install Playwright system deps (cache hit)
        if: steps.cache-playwright-browsers.outputs.cache-hit == 'true'
        working-directory: e2e
        run: pnpm exec playwright install-deps chromium firefox

      - name: Build test studio and dependencies
        run: pnpm turbo build --filter=test-studio...

      - name: Run e2e smoke tests
        id: playwright
        working-directory: e2e
        env:
          SANITY_E2E_SESSION_TOKEN: ${{ secrets.SANITY_E2E_SESSION_TOKEN }}
        run: pnpm test
        continue-on-error: true

      - name: Extract test summary
        id: summary
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: |
          if [ ! -f test-summary.json ]; then
            echo "summary=⚪ no summary produced" >> "$GITHUB_OUTPUT"
            echo "passed=0" >> "$GITHUB_OUTPUT"
            echo "failed=0" >> "$GITHUB_OUTPUT"
            echo "flaky=0" >> "$GITHUB_OUTPUT"
            echo "skipped=0" >> "$GITHUB_OUTPUT"
            echo "failed_files_formatted=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e "
            const s = JSON.parse(require('fs').readFileSync('test-summary.json', 'utf8'));
            const parts = [];
            if (s.passed) parts.push('🟢 ' + s.passed + ' passed');
            if (s.failed) parts.push('🔴 ' + s.failed + ' failed');
            if (s.flaky) parts.push('🟡 ' + s.flaky + ' flaky');
            if (s.skipped) parts.push('⚪ ' + s.skipped + ' skipped');
            console.log('summary=' + (parts.join(' • ') || '⚪ no tests'));
            console.log('passed=' + s.passed);
            console.log('failed=' + s.failed);
            console.log('flaky=' + s.flaky);
            console.log('skipped=' + s.skipped);
            if (s.failedFilesFormatted) {
              process.stdout.write('failed_files_formatted<<ENDOFFILES\n');
              process.stdout.write(s.failedFilesFormatted + '\n');
              process.stdout.write('ENDOFFILES\n');
            }
          " >> "$GITHUB_OUTPUT"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/results
            e2e/blob-report
            e2e/test-summary.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Update PR Comment (tests passed)
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        if: github.event_name == 'pull_request' && steps.playwright.outcome == 'success'
        with:
          comment-tag: e2e-status
          message: |
            ### ✅ E2E Tests

            ${{ steps.summary.outputs.summary }} • [view run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            HTML report is attached as the `playwright-report-${{ github.run_id }}` workflow artifact.

      - name: Update PR Comment (tests failed)
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        if: github.event_name == 'pull_request' && steps.playwright.outcome != 'success'
        with:
          comment-tag: e2e-status
          message: |
            ### ❌ E2E Tests

            ${{ steps.summary.outputs.summary }} • [view run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            HTML report is attached as the `playwright-report-${{ github.run_id }}` workflow artifact.

            <details>
            <summary>Debug failing tests locally</summary>

            ```sh
            SANITY_E2E_PROJECT_ID=${{ vars.SANITY_E2E_PROJECT_ID }} \
            SANITY_E2E_STUDIO_DATASET=${{ vars.SANITY_E2E_STUDIO_DATASET }} \
            pnpm test:e2e --headed \
              ${{ steps.summary.outputs.failed_files_formatted }}
            ```

            </details>

      - name: Fail job if Playwright failed
        if: steps.playwright.outcome != 'success'
        run: exit 1
