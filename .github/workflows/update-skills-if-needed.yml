name: Update skills if needed

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Mondays at 6am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm dlx skills experimental_install --yes
      - run: pnpm dlx skills add https://github.com/vercel-labs/skills --skill find-skills --agent claude-code cursor --yes
      - run: pnpm dlx skills update
      - run: pnpm format
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.ECOSPARK_APP_ID }}
          private-key: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        id: pr
        with:
          body: I ran `pnpm dlx skills update` and `pnpm format` 🧑‍💻
          branch: actions/update-skills/${{ github.ref_name }}
          commit-message: 'chore(skills): 🤖 ✨'
          labels: 🤖 bot
          sign-commits: true
          title: 'chore(skills): 🤖 ✨'
          token: ${{ steps.generate-token.outputs.token }}
      - name: Enable automerge on Pull Request
        if: steps.pr.outputs.pull-request-operation == 'created'
        run: gh pr merge --squash --auto "${{ steps.pr.outputs.pull-request-number }}"
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
