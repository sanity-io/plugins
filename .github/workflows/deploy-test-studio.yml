name: Deploy Test Studio

on:
  push:
    branches: [main]
    paths:
      - 'dev/test-studio/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo build --filter=test-studio^...
      - run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt/3"
            if pnpm sanity deploy -y; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Deploy failed, retrying in 15 seconds..."
              sleep 15
            fi
          done

          echo "Deploy failed after 3 attempts."
          exit 1
        working-directory: dev/test-studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_DEPLOY_TOKEN }}
          SANITY_STUDIO_GOOGLE_MAPS_API_KEY: ${{ secrets.SANITY_STUDIO_GOOGLE_MAPS_API_KEY }}
