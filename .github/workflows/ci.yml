name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm turbo run build --filter='!./dev/*'

  lint:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint --format github

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run Knip
        run: pnpm knip --reporter github-actions

  storybook-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Store Playwright's version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm --filter plugins-storybook exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Playwright's version: $PLAYWRIGHT_VERSION"
          echo "version=${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers for Playwright's version
        id: cache-playwright-browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-version.outputs.version }}-playwright-browsers-chromium
      - name: Install Playwright browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm --filter plugins-storybook exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.cache-playwright-browsers.outputs.cache-hit == 'true'
        run: pnpm --filter plugins-storybook exec playwright install-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vitest-failure-screenshots
          path: dev/storybook/**/__screenshots__/
          if-no-files-found: ignore

  test_shards:
    name: Test (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    needs: build
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Test (PR)
        if: github.event_name == 'pull_request'
        run: pnpm test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --passWithNoTests --coverage --reporter=default --reporter=blob
      - name: Test
        if: github.event_name != 'pull_request'
        run: pnpm test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --passWithNoTests
      - name: Upload coverage report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ github.run_id }}-${{ matrix.shardIndex }}
          path: '.vitest/blob/*'
          include-hidden-files: true
          retention-days: 1

  test:
    name: test
    runs-on: ubuntu-latest
    needs: test_shards
    if: ${{ !cancelled() }}
    steps:
      - name: Check test shard status
        env:
          RESULT: ${{ needs.test_shards.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Test shards failed with status: $RESULT"
            exit 1
          fi

  report_coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: test_shards
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test_shards.result == 'success' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          path: .vitest/blob
          pattern: blob-report-${{ github.run_id }}-*
          merge-multiple: true
      - name: Merge coverage reports
        run: pnpm vitest run --merge-reports --coverage
      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
